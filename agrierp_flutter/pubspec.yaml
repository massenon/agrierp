name: agrierp
description: "AgriERP Desktop — Ferme École OLOUWACHEGOUN (Ikpinlè, Bénin). Client Windows offline-first, synchronisé avec la surface web Laravel."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # ─── Localisation française des composants Material (ticket U5, D-U5) ───
  # Sélecteurs de date, boutons « ANNULER » / « OK », infobulles : sans elle,
  # Flutter les affiche en anglais (« Select date », « CANCEL »). Paquet du SDK
  # Flutter : aucun téléchargement à l'installation.
  flutter_localizations:
    sdk: flutter

  # ─── Persistance locale offline-first ────────────────────────────────────
  # Drift sur SQLite : le CDC impose un fonctionnement local prioritaire, la
  # synchronisation réseau n'intervenant qu'ensuite.
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # ─── Identifiants ────────────────────────────────────────────────────────
  # ⚠️ CDC §291 : toute table synchronisable porte une clé primaire UUID,
  # JAMAIS un entier auto-incrémenté — deux appareils hors ligne créeraient
  # sinon des enregistrements de même identifiant, et la synchronisation en
  # perdrait un sans le dire.
  uuid: ^4.5.1

  # ─── État applicatif ─────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ─── Sync Engine — moitié cliente ────────────────────────────────────────
  # Les endpoints serveur existent déjà côté Laravel : POST /api/auth/login,
  # GET /api/sync/pull, POST /api/sync/push (jeton Sanctum nommé par appareil).
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.2
  # Verrou local (ticket VL-1) : HMAC-SHA256 de la dérivation PBKDF2 du code PIN (déjà tirée par les autres paquets).
  crypto: ^3.0.3

  # ─── Présentation ────────────────────────────────────────────────────────
  # ⚠️ ^0.20.2 : `flutter_localizations` (ticket U5) épingle intl 0.20.x selon
  # la version du SDK (0.20.2 ou 0.20.3) ; ^0.20.2 convient aux deux.
  intl: ^0.20.2

  # ─── Édition des rapports (ticket F0.52) ─────────────────────────────────
  # ⚠️ TOUTES TROIS SONT DU DART PUR OU UN GREFFON WINDOWS LOCAL : rien ne
  # part sur le réseau à l'édition. C'est la condition pour qu'un rapport
  # s'imprime à la ferme le jour où la liaison est tombée — soit précisément
  # le jour où le poste sert à quelque chose.
  #
  # ⚠️ `printing` ouvre la boîte d'impression de Windows, qui offre aussi
  # « Enregistrer au format PDF ». Écrire le fichier nous-mêmes obligerait à
  # choisir un dossier à la place de l'utilisateur.
  pdf: ^3.12.0
  printing: ^5.14.3
  # ⚠️ Le QR de la fiche sujet encode l'IDENTIFIANT lisible, comme le web.
  qr_flutter: ^4.1.0
  excel: ^4.0.6
  # Ticket CFG-2 — « Envoyer un e-mail de test » RÉEL depuis l'onglet Email (SMTP) du poste.
  mailer: ^7.2.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  # ⚠️ LE LOGO EST EMBARQUÉ, PAS CHARGÉ. `pdf-export.js` le tire de
  # `assets/images/logo.png` et tolère son absence (`onerror`) : sur le web, un
  # logo manquant laisse un document lisible. Ici il doit être PRÉSENT — un
  # rapport imprimé sort de la ferme, et l'en-tête officiel en fait partie.
  # C'est le même fichier que la maquette, copié et non redessiné.
  #
  # ⚠️ ROBOTO EST EMBARQUÉE POUR LES DOCUMENTS PDF (ticket F0.75). La police par
  # défaut du moteur PDF (Helvetica) n'a pas Unicode : le tiret cadratin « — » et
  # l'apostrophe typographique « ’ » y sortent en CARRÉ BARRÉ, y compris dans le
  # pied de page des trois structures. Licence Apache 2.0 (fichier joint), copiée
  # du SDK Flutter.
  #
  # Ticket ENV1 — `assets/images/image_login.png` : l'image du panneau gauche de l'écran de connexion. Copie OCTET
  # POUR OCTET de `agrierp_laravel/public/assets/images/image_login.png` (que le Blade `auth/login.blade.php` pose en
  # fond, sous un voile). ⚠️ Le fichier du web est un JPEG au nom en `.png` : Flutter décode d'après le contenu, ne
  # pas le « convertir » (ce ne serait plus le même fichier). Absent, l'écran se rabat sur un panneau de marque.
  assets:
    - assets/images/logo.png
    - assets/images/image_login.png
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    # ATT-3 — l'attestation est fabriquée AU POSTE (hors ligne) : logo, filigrane, décor et polices libres du modèle officiel.
    - assets/attestation/

  # Ticket H1 — LES ICÔNES DU WEB : Material Symbols Outlined (style `material-symbols-outlined`, FILL 0), et
  # non les Material Icons pleines de Flutter. Sous-ensemble tiré de la fonte complète du web par
  # `outils/icones_poste.py` (classe `SymbolesAgri`), axes figés au réglage du web (FILL 0, wght 400).
  # Licence Apache 2.0, comme au web.
  fonts:
    - family: MaterialSymbolsOutlined
      fonts:
        - asset: assets/fonts/MaterialSymbolsOutlined.ttf
